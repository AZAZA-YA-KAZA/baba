<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Добавить рецепт</title>
    <style>
        body { padding: 20px; font-family: Arial, sans-serif; background: #f8f9fa; margin: 0; }
        .form-container {
            max-width: 600px; margin: 40px auto; background: white;
            padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        h1 { text-align: center; color: #2c3e50; }
        input, textarea {
            width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd;
            border-radius: 6px; font-size: 16px; box-sizing: border-box;
        }
        textarea { min-height: 120px; resize: vertical; }
        button {
            padding: 12px 24px; margin: 10px 8px 0 0; border: none; border-radius: 6px;
            cursor: pointer; font-size: 16px;
        }
        .save-btn { background: #27ae60; color: white; }
        .save-btn:hover { background: #219a52; }
        .cancel-btn { background: #95a5a6; color: white; }
        .cancel-btn:hover { background: #7f8c8d; }
        .success, .error-msg {
            padding: 15px; margin: 20px 0; border-radius: 8px; text-align: center; font-weight: bold;
        }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error-msg { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>
<div class="form-container">
    <h1>Добавить новый рецепт</h1>
    <form id="recipeForm">
        <input type="text" id="title" placeholder="Название рецепта *" required>
        <textarea id="description" placeholder="Полное описание рецепта (ингредиенты, шаги и т.д.) *" required></textarea>
        <input type="url" id="photoUrl" placeholder="Ссылка на фото (необязательно)">

        <div style="text-align: center; margin-top: 20px;">
            <button type="submit" class="save-btn">Сохранить рецепт</button>
            <button type="button" class="cancel-btn" onclick="window.location.href='index.html'">Отмена</button>
        </div>
    </form>
    <div id="message"></div>
</div>

<script>
    const API = 'http://localhost:8080/api/kulinare';

    document.getElementById('recipeForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const title = document.getElementById('title').value.trim();
        const description = document.getElementById('description').value.trim();
        const photoUrl = document.getElementById('photoUrl').value.trim() || null;

        if (!title || !description) {
            showMessage('Заполните все обязательные поля!', true);
            return;
        }

        showMessage('Сохранение...');

        try {
            const res = await fetch(`${API}/recipe`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title, description, photoUrl })
            });

            if (!res.ok) {
                const err = await res.text();
                throw new Error(`Ошибка сервера: ${res.status} — ${err}`);
            }

            const recipe = await res.json();
            showMessage(`Рецепт "${title}" успешно создан! ID: ${recipe.idRecipe}`, false);

            setTimeout(() => window.location.href = 'index.html', 2000);
        } catch (err) {
            console.error(err);
            showMessage(`Ошибка: ${err.message}`, true);
        }
    });

    function showMessage(text, isError = false) {
        const msg = document.getElementById('message');
        msg.innerHTML = `<div class="${isError ? 'error-msg' : 'success'}">${text}</div>`;
    }
</script>
</body>
</html>
