<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Просмотр рецепта</title>
    <style>
        :root {
            --bg: #fff7ed;
            --card: #ffffff;
            --text: #2d1b10;
            --muted: #7c6f64;
            --accent: #f97316;
            --accent-dark: #ea580c;
            --accent-soft: #ffedd5;
            --green: #16a34a;
            --danger: #dc2626;
            --shadow: 0 18px 45px rgba(124, 45, 18, 0.12);
            --radius: 22px;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at top left, #fed7aa 0, transparent 34%),
                linear-gradient(135deg, #fff7ed 0%, #fffbeb 100%);
        }

        .page {
            width: min(920px, calc(100% - 32px));
            margin: 0 auto;
            padding: 32px 0 48px;
        }

        .top-link {
            color: #9a3412;
            text-decoration: none;
            font-weight: 700;
            display: inline-flex;
            margin-bottom: 18px;
        }

        .card {
            background: rgba(255, 255, 255, 0.92);
            border: 1px solid rgba(249, 115, 22, 0.16);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .content { padding: 28px; }
        .recipe-image { width: 100%; max-height: 420px; object-fit: cover; background: #ffedd5; display: block; }
        h1 { margin: 0 0 12px; font-size: clamp(32px, 5vw, 48px); letter-spacing: -1px; }
        h2 { margin: 28px 0 14px; font-size: 24px; }
        .description { color: #3f332a; line-height: 1.7; white-space: pre-wrap; background: #fff7ed; border-radius: 18px; padding: 18px; border: 1px solid #fed7aa; }

        .actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 22px; }

        button, .button-link {
            border: none;
            border-radius: 14px;
            padding: 12px 18px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s ease;
        }

        .primary { background: var(--accent); color: white; }
        .primary:hover { background: var(--accent-dark); transform: translateY(-1px); }
        .secondary { background: white; color: var(--text); border: 1px solid #fed7aa; }
        .secondary:hover { background: #fff7ed; transform: translateY(-1px); }
        .danger { background: var(--danger); color: white; }
        .danger:hover { background: #b91c1c; transform: translateY(-1px); }

        .list { display: grid; gap: 10px; }
        .item {
            background: white;
            border: 1px solid #fed7aa;
            border-left: 5px solid var(--accent);
            border-radius: 14px;
            padding: 14px 16px;
            line-height: 1.5;
        }
        .step { border-left-color: var(--green); }
        .empty, .loading, .error { text-align: center; padding: 34px; color: var(--muted); }
        .error { color: var(--danger); background: #fee2e2; border-radius: 16px; margin: 24px; }
    </style>
</head>
<body>
<div class="page">
    <a class="top-link" href="index.html">Назад к списку</a>

    <main id="recipeContainer" class="card">
        <div id="loadingMessage" class="loading">Загрузка рецепта...</div>
        <div id="recipeContent" style="display: none;"></div>
    </main>
</div>

<script>
    const API_BASE_URL = 'http://localhost:8080/api/kulinare';

    function escapeHtml(value) {
        return String(value ?? '')
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#039;');
    }

    async function apiRequest(endpoint, method = 'GET', data = null) {
        const options = {
            method,
            headers: {
                'Content-Type': 'application/json',
                'Accept': 'application/json'
            }
        };

        if (data && (method === 'POST' || method === 'PUT')) {
            options.body = JSON.stringify(data);
        }

        const response = await fetch(`${API_BASE_URL}${endpoint}`, options);
        if (!response.ok) {
            const errorText = await response.text();
            throw new Error(`Ошибка ${response.status}: ${errorText}`);
        }

        return method === 'DELETE' ? await response.text() : await response.json();
    }

    const api = {
        getRecipe: (id) => apiRequest(`/recipe/${id}`),
        deleteRecipe: (id) => apiRequest(`/recipe/${id}`, 'DELETE'),
        getIngredients: (recipeId) => apiRequest(`/${recipeId}/ingredient`),
        getSteps: (recipeId) => apiRequest(`/${recipeId}/step`)
    };

    const recipeId = new URLSearchParams(window.location.search).get('id');

    async function loadRecipe() {
        const loadingMessage = document.getElementById('loadingMessage');
        const recipeContent = document.getElementById('recipeContent');

        if (!recipeId) {
            loadingMessage.innerHTML = '<div class="error">ID рецепта не указан в адресной строке.</div>';
            return;
        }

        try {
            const recipe = await api.getRecipe(recipeId);

            let ingredients = [];
            let steps = [];

            try { ingredients = await api.getIngredients(recipeId); } catch (error) { console.log(error); }
            try { steps = await api.getSteps(recipeId); } catch (error) { console.log(error); }

            recipeContent.innerHTML = renderRecipe(recipe, ingredients, steps);
            loadingMessage.style.display = 'none';
            recipeContent.style.display = 'block';
        } catch (error) {
            loadingMessage.innerHTML = `<div class="error">Не удалось загрузить рецепт: ${escapeHtml(error.message)}</div>`;
        }
    }

    function renderRecipe(recipe, ingredients, steps) {
        const photo = recipe.photoUrl
            ? `<img src="${escapeHtml(recipe.photoUrl)}" alt="${escapeHtml(recipe.title)}" class="recipe-image" onerror="this.style.display='none'">`
            : '';

        return `
            ${photo}
            <div class="content">
                <h1>${escapeHtml(recipe.title || 'Без названия')}</h1>
                <div class="description">${escapeHtml(recipe.description || 'Описание отсутствует')}</div>

                <div class="actions">
                    <button class="danger" onclick="deleteRecipe(${Number(recipe.idRecipe)})">Удалить рецепт</button>
                    <a class="button-link secondary" href="index.html">К списку рецептов</a>
                </div>

                <h2>Ингредиенты</h2>
                <div class="list">${renderIngredients(ingredients)}</div>

                <h2>Шаги приготовления</h2>
                <div class="list">${renderSteps(steps)}</div>
            </div>
        `;
    }

    function renderIngredients(ingredients) {
        if (!ingredients || ingredients.length === 0) {
            return '<div class="empty">Ингредиенты не указаны.</div>';
        }

        return ingredients.map(item => {
            if (Array.isArray(item) && item.length >= 3) {
                return `<div class="item">${escapeHtml(item[2])}: ${escapeHtml(item[0])} ${escapeHtml(item[1])}</div>`;
            }
            return `<div class="item">${escapeHtml(item.name || '')}: ${escapeHtml(item.quantity || item.count || '')} ${escapeHtml(item.unit || '')}</div>`;
        }).join('');
    }

    function renderSteps(steps) {
        if (!steps || steps.length === 0) {
            return '<div class="empty">Шаги приготовления не указаны.</div>';
        }

        return steps
            .sort((a, b) => (a.stepOrder || 0) - (b.stepOrder || 0))
            .map((step, index) => `
                <div class="item step">
                    <strong>Шаг ${escapeHtml(step.stepOrder || index + 1)}.</strong>
                    ${escapeHtml(step.stepDescription || step.description || step)}
                </div>
            `).join('');
    }

    async function deleteRecipe(id) {
        if (!confirm('Удалить этот рецепт?')) return;

        try {
            await api.deleteRecipe(id);
            window.location.href = 'index.html';
        } catch (error) {
            alert(`Не удалось удалить рецепт: ${error.message}`);
        }
    }

    window.onload = loadRecipe;
</script>
</body>
</html>
