<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Просмотр рецепта</title>

    <!--
    =========================================================================
    RECIPE.HTML — Страница детального просмотра рецепта

    Назначение:
        Отображает полную информацию о выбранном рецепте:
        • Название, описание и фото
        • Список ингредиентов
        • Пошаговую инструкцию приготовления
        • Кнопки редактирования и удаления рецепта

    Технологии:
        - Чистый HTML + CSS
        - Vanilla JavaScript
        - Fetch API для взаимодействия с backend

    Параметры URL:
        ?id=123   — обязательный параметр (ID рецепта)

    Связанные файлы:
        - index.html → возвращение к списку рецептов
        - add-recipe.html - создание нового рецепта

    API-эндпоинты, которые используются:
        GET    /recipe/{id}           → получение рецепта
        GET    /{recipeId}/ingredient → получение ингредиентов
        GET    /{recipeId}/step       → получение шагов приготовления
        DELETE /recipe/{id}           → удаление рецепта

    Важно:
        Эта страница является vanilla JS версией.
        Основная разработка рекомендуется вести в Kotlin/JS + Compose for Web.
    =========================================================================
    -->

    <style>
        body {
            padding: 20px;
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
        }
        h1 { color: #2c3e50; margin-bottom: 10px; }
        h2 {
            color: #34495e;
            margin-top: 30px;
            border-bottom: 2px solid #3498db;
            padding-bottom: 5px;
        }
        #recipeContainer {
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.1);
            max-width: 800px;
            margin: 0 auto;
        }
        button {
            padding: 10px 20px;
            margin: 5px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        .back-btn {
            background-color: #7f8c8d;
            color: white;
            margin-bottom: 20px;
        }
        .back-btn:hover { background-color: #95a5a6; }
        .edit-btn { background-color: #3498db; color: white; }
        .edit-btn:hover { background-color: #2980b9; }
        .delete-btn { background-color: #e74c3c; color: white; }
        .delete-btn:hover { background-color: #c0392b; }
        .recipe-description {
            line-height: 1.6;
            margin: 20px 0;
            color: #444;
            font-size: 16px;
            padding: 15px;
            background-color: #f8f9fa;
            border-radius: 5px;
            border-left: 4px solid #3498db;
        }
        .recipe-image {
            max-width: 100%;
            height: auto;
            margin: 15px 0;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .ingredient-item, .step-item {
            background: #f8f9fa;
            padding: 12px 15px;
            margin: 8px 0;
            border-radius: 5px;
            border-left: 4px solid #3498db;
        }
        .step-item { border-left-color: #2ecc71; }
        .loading {
            color: #7f8c8d;
            font-style: italic;
            text-align: center;
            padding: 30px;
        }
        .error {
            color: #e74c3c;
            padding: 20px;
            background: #fdeaea;
            border-radius: 5px;
            text-align: center;
        }
        .no-data {
            color: #95a5a6;
            font-style: italic;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 5px;
            text-align: center;
        }
    </style>
</head>
<body>

<button class="back-btn" onclick="window.location.href='index.html'">
    ← Назад к списку рецептов
</button>

<div id="recipeContainer">
    <div class="loading" id="loadingMessage">
        Загрузка рецепта...
    </div>
    <div id="recipeContent" style="display: none;"></div>
</div>

<script>
    /**
     * Базовый URL API backend'а кулинарной книги
     * @type {string}
     */
    const API_BASE_URL = 'http://localhost:8080/api/kulinare';

    // ====================== API ======================

    /**
     * Универсальная функция для выполнения HTTP-запросов
     *
     * @param {string} endpoint - относительный путь или полный URL
     * @param {string} [method='GET'] - HTTP-метод
     * @param {Object|null} [data=null] - данные для POST/PUT
     * @returns {Promise<Object|string>}
     */
    async function apiRequest(endpoint, method = 'GET', data = null) {
        const url = endpoint.startsWith('http') ? endpoint : `${API_BASE_URL}${endpoint}`;

        const options = {
            method: method,
            headers: {
                'Content-Type': 'application/json',
                'Accept': 'application/json'
            }
        };

        if (data && (method === 'POST' || method === 'PUT')) {
            options.body = JSON.stringify(data);
        }

        try {
            console.log(`[API] ${method} ${url}`);
            const response = await fetch(url, options);

            if (!response.ok) {
                const errorText = await response.text();
                throw new Error(`HTTP ${response.status}: ${errorText}`);
            }

            if (method === 'DELETE') {
                return response.text();
            }

            return await response.json();
        } catch (error) {
            console.error('[API Error]', error);
            throw error;
        }
    }

    /**
     * Объект с методами API для удобного использования
     */
    const api = {
        getRecipe:      (id) => apiRequest(`/recipe/${id}`, 'GET'),
        deleteRecipe:   (id) => apiRequest(`/recipe/${id}`, 'DELETE'),
        getIngredients: (recipeId) => apiRequest(`/${recipeId}/ingredient`, 'GET'),
        getSteps:       (recipeId) => apiRequest(`/${recipeId}/step`, 'GET')
        // createRecipe и updateRecipe пока не используются на этой странице
    };

    // ====================== ОСНОВНАЯ ЛОГИКА ======================

    /**
     * ID текущего рецепта, полученный из параметров URL (?id=...)
     * @type {string|null}
     */
    const urlParams = new URLSearchParams(window.location.search);
    const recipeId = urlParams.get('id');

    if (!recipeId) {
        document.getElementById('loadingMessage').innerHTML =
            '<div class="error">Ошибка: ID рецепта не указан в URL</div>';
    }

    /**
     * Основная функция загрузки и отображения рецепта.
     * Выполняется автоматически при загрузке страницы.
     */
    async function loadRecipe() {
        const loadingMessage = document.getElementById('loadingMessage');
        const recipeContent = document.getElementById('recipeContent');

        try {
            const recipe = await api.getRecipe(recipeId);

            // Загружаем дополнительные данные (необязательно)
            let ingredients = [];
            let steps = [];

            try { ingredients = await api.getIngredients(recipeId); } catch (e) { console.warn('Ингредиенты не загружены', e); }
            try { steps = await api.getSteps(recipeId); } catch (e) { console.warn('Шаги не загружены', e); }

            displayRecipe(recipe, ingredients, steps);

            // Переключаем видимость
            loadingMessage.style.display = 'none';
            recipeContent.style.display = 'block';

        } catch (error) {
            console.error('Ошибка загрузки рецепта:', error);
            loadingMessage.innerHTML = `
                    <div class="error">
                        ❌ Ошибка загрузки рецепта: ${error.message}<br><br>
                        <button onclick="window.location.href='index.html'">Вернуться к списку рецептов</button>
                    </div>
                `;
        }
    }

    /**
     * Формирует и вставляет HTML с данными рецепта
     *
     * @param {Object} recipe - основной объект рецепта
     * @param {Array} ingredients - список ингредиентов
     * @param {Array} steps - список шагов приготовления
     */
    function displayRecipe(recipe, ingredients, steps) {
        const recipeContent = document.getElementById('recipeContent');

        let html = `
                <h1>${recipe.title || 'Без названия'}</h1>
                ${recipe.photoUrl ?
            `<img src="${recipe.photoUrl}" alt="${recipe.title}" class="recipe-image" onerror="this.style.display='none'">` : ''}

                <div class="recipe-description">
                    ${recipe.description || 'Описание отсутствует'}
                </div>

                <div style="margin: 25px 0; padding: 20px; background: #f8f9fa; border-radius: 5px; text-align: center;">
                    <button class="edit-btn" onclick="editRecipe(${recipe.idRecipe || recipe.id})">✏️ Редактировать</button>
                    <button class="delete-btn" onclick="deleteRecipe(${recipe.idRecipe || recipe.id})">🗑️ Удалить рецепт</button>
                </div>
            `;

        // Ингредиенты
        html += `<h2>📋 Ингредиенты</h2>`;
        if (ingredients && ingredients.length > 0) {
            ingredients.forEach(item => {
                if (typeof item === 'object') {
                    html += `<div class="ingredient-item">
                            ${item.name || ''}: ${item.quantity || ''} ${item.unit || ''}
                        </div>`;
                }
            });
        } else {
            html += `<div class="no-data">Ингредиенты не указаны</div>`;
        }

        // Шаги приготовления
        html += `<h2>👨‍🍳 Шаги приготовления</h2>`;
        if (steps && steps.length > 0) {
            steps.sort((a, b) => (a.stepOrder || a.stepNumber || 0) - (b.stepOrder || b.stepNumber || 0));
            steps.forEach((step, index) => {
                html += `
                        <div class="step-item">
                            <strong>Шаг ${step.stepOrder || step.stepNumber || index + 1}:</strong>
                            ${step.stepDescription || step.description || step}
                        </div>`;
            });
        } else {
            html += `<div class="no-data">Шаги приготовления не указаны</div>`;
        }

        recipeContent.innerHTML = html;
    }

    /**
     * Заглушка функции редактирования рецепта
     * @param {number} id - ID рецепта
     */
    function editRecipe(id) {
        const newTitle = prompt('Введите новое название рецепта:');
        if (newTitle) {
            alert('Функция полного редактирования пока в разработке.');
        }
    }

    /**
     * Удаляет рецепт после подтверждения пользователя
     * @param {number} id - ID рецепта
     */
    async function deleteRecipe(id) {
        if (!confirm('Вы уверены, что хотите удалить этот рецепт?\nЭто действие нельзя отменить.')) {
            return;
        }

        try {
            await api.deleteRecipe(id);
            alert('Рецепт успешно удалён!');
            window.location.href = 'index.html';
        } catch (error) {
            console.error('Ошибка удаления:', error);
            alert('Не удалось удалить рецепт: ' + error.message);
        }
    }

    // Автозагрузка рецепта при открытии страницы
    window.onload = loadRecipe;

</script>
</body>
</html>
