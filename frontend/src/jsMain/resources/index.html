<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кулинарная книга</title>
    <style>
        body { padding: 20px; font-family: Arial, sans-serif; background-color: #f8f9fa; margin: 0; }
        h1 { color: #2c3e50; margin-bottom: 20px; text-align: center; }
        .container { max-width: 900px; margin: 0 auto; }
        .controls { text-align: center; margin-bottom: 20px; }
        button { padding: 10px 20px; background: #3498db; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; margin: 0 8px; }
        button:hover { background: #2980b9; }
        .recipe-item {
            background: white; padding: 18px; margin: 12px 0; border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1); border-left: 4px solid #3498db;
        }
        .recipe-title { font-size: 20px; font-weight: bold; color: #2c3e50; margin-bottom: 8px; }
        .recipe-description { color: #555; line-height: 1.5; }
        .no-recipes { text-align: center; color: #7f8c8d; font-style: italic; padding: 40px; }
    </style>
</head>
<body>
<div class="container">
    <h1>Кулинарная книга</h1>
    <div class="controls">
        <button onclick="addRecipe()">Добавить рецепт</button>
        <button onclick="loadRecipes()">Обновить список</button>
    </div>

    <div id="recipeList">
        <p class="no-recipes">Загрузка рецептов...</p>
    </div>
</div>

<script>
    const API = 'http://localhost:8080/api/kulinare';

    async function getRecipes() {
        const res = await fetch(`${API}/recipes`);
        if (!res.ok) throw new Error('Не удалось загрузить рецепты');
        return await res.json();
    }

    async function loadRecipes() {
        const list = document.getElementById('recipeList');
        list.innerHTML = '<p>Загрузка...</p>';

        try {
            const recipes = await getRecipes();
            if (!recipes || recipes.length === 0) {
                list.innerHTML = '<p class="no-recipes">Рецептов пока нет. Добавьте первый!</p>';
                return;
            }

            list.innerHTML = '';
            recipes.forEach(r => {
                const div = document.createElement('div');
                div.className = 'recipe-item';
                div.innerHTML = `
                    <div class="recipe-title">${r.title || 'Без названия'}</div>
                    <div class="recipe-description">
                        ${r.description ? r.description.substring(0, 150) + '...' : 'Нет описания'}
                    </div>
                    <button onclick="viewRecipe(${r.idRecipe})" style="margin-top: 10px; padding: 8px 16px; font-size: 14px;">
                        Открыть рецепт →
                    </button>
                `;
                list.appendChild(div);
            });
        } catch (e) {
            list.innerHTML = `<p style="color: red; text-align: center;">Ошибка: ${e.message}</p>`;
        }
    }

    function addRecipe() {
        window.location.href = 'add-recipe.html';
    }

    function viewRecipe(id) {
        window.location.href = `recipe.html?id=${id}`;
    }

    // Автозагрузка при открытии
    window.onload = loadRecipes;
</script>
</body>
</html>
